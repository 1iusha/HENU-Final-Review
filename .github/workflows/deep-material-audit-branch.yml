name: Deep material audit

on:
  push:
    branches:
      - chore/migrate-material-types

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/migrate-material-types
          fetch-depth: 0
      - name: Run deep audit
        shell: bash
        run: |
          python3 skills/henu-public-materials/scripts/check_public_materials.py . --deep > docs/material-audit-temp.txt 2>&1 || true
          cat docs/material-audit-temp.txt
      - name: Commit temporary report
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/material-audit-temp.txt
          git commit -m 'chore(audit): capture deep material audit report'
          git push origin HEAD:chore/migrate-material-types
