name: Fix network sample classification

on:
  push:
    branches:
      - chore/migrate-material-types

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/migrate-material-types
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reclassify sample paper
        shell: bash
        run: |
          mkdir -p '计算机网络/题库练习'
          git mv '计算机网络/往年真题/计算机网络_样卷_sample.pdf' '计算机网络/题库练习/计算机网络_题库练习_样卷.pdf'
          node <<'NODE'
          const fs = require('fs');
          const manifest = JSON.parse(fs.readFileSync('manifest.json', 'utf8'));
          const subject = manifest.subjects.find((item) => item.name === '计算机网络');
          if (!subject) throw new Error('计算机网络 subject not found');
          const asset = subject.assets.find((item) => item.publicPath === '计算机网络/往年真题/计算机网络_样卷_sample.pdf');
          if (!asset) throw new Error('sample asset not found');
          asset.role = '题库练习';
          asset.title = '计算机网络_题库练习_样卷.pdf';
          asset.publicPath = '计算机网络/题库练习/计算机网络_题库练习_样卷.pdf';
          subject.note = '包含考前复习讲义和样卷练习资料。';
          manifest.generatedAt = new Date().toISOString();
          fs.writeFileSync('manifest.json', JSON.stringify(manifest, null, 2) + '\n');
          NODE
          node scripts/update-readme.mjs
      - run: node scripts/refresh-manifest-metadata.mjs --check
      - run: node scripts/validate-materials.mjs
      - run: python3 skills/henu-public-materials/scripts/check_public_materials.py .
      - run: node scripts/update-readme.mjs --check
      - name: Commit and push
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(计算机网络): 将样卷归入题库练习'
          git push origin HEAD:chore/migrate-material-types
