name: Migrate legacy material types

on:
  push:
    branches:
      - chore/migrate-material-types

permissions:
  contents: write

jobs:
  migrate:
    name: Migrate legacy directories and verify repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@v4
        with:
          ref: chore/migrate-material-types
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Migrate legacy material types
        run: node scripts/migrate-material-types.mjs --write

      - name: Rebuild README catalog
        run: node scripts/update-readme.mjs

      - name: Test material validation rules
        run: node --test tests/*.test.mjs

      - name: Check manifest file metadata freshness
        run: node scripts/refresh-manifest-metadata.mjs --check

      - name: Validate materials
        run: node scripts/validate-materials.mjs

      - name: Run supplemental repository audit
        run: python3 skills/henu-public-materials/scripts/check_public_materials.py .

      - name: Check generated README catalog
        run: node scripts/update-readme.mjs --check

      - name: Confirm migration is complete
        run: node scripts/migrate-material-types.mjs --check

      - name: Commit migration result
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No migration changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore(materials): migrate legacy type directories"
          git push origin HEAD:chore/migrate-material-types
