name: Package year-uncertain review files

on:
  push:
    branches:
      - chore/review-year-uncertain

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Collect year-uncertain files
        shell: bash
        run: |
          mkdir -p review-files
          cp --parents \
            '高等数学A（二）/待复核资料/高等数学A（二）_待复核_软件学院23级真题回忆版.pdf' \
            '专业英语/待复核资料/专业英语_待复核_选择题回忆版.docx' \
            '大数据/待复核资料/大数据_待复核_选择题回忆版.docx' \
            '工程经济学/待复核资料/工程经济学_待复核_期末考试试卷附标准答案.docx' \
            '工程经济学/待复核资料/工程经济学_待复核_期末考试试题.pdf' \
            '机器学习/待复核资料/机器学习_待复核_2023-2024学年第二学期A卷.docx' \
            '机器学习/待复核资料/机器学习_待复核_2024卷子实拍.docx' \
            '机器学习/待复核资料/机器学习_待复核_选择题回忆版.docx' \
            '软件工程/待复核资料/软件工程_待复核_试卷.docx' \
            '软件工程/待复核资料/软件工程_待复核_试卷整理.docx' \
            '编译原理/待复核资料/编译原理_待复核_惠普测试151与惠普开发151试卷A.docx' \
            '编译原理/待复核资料/编译原理_待复核_计算161-2试卷A答案解析.docx' \
            '编译原理/待复核资料/编译原理_待复核_计算161-2试卷B答案解析.docx' \
            '计算机操作系统/待复核资料/计算机操作系统_待复核_真题卷子.docx' \
            '软件项目管理/待复核资料/软件项目管理_待复核_选择题回忆版.docx' \
            '软件质量测试/待复核资料/软件质量测试_待复核_选择题回忆版.docx' \
            review-files/
      - uses: actions/upload-artifact@v4
        with:
          name: year-uncertain-review-files
          path: review-files
          if-no-files-found: error
          retention-days: 1
