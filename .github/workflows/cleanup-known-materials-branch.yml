name: Clean known material issues

on:
  push:
    branches:
      - chore/migrate-material-types

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/migrate-material-types
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply high-confidence material cleanup
        shell: bash
        run: |
          # 1) Correct the MapReduce exercise filename.
          git mv '大数据/题库练习/大数据_题库练习_mpre课后题.md' '大数据/题库练习/大数据_题库练习_MapReduce课后题.md'

          # 2) Database 07-1 has two 99.8%-similar PPTX decks. Keep the explicitly latest deck under the canonical filename.
          git rm '数据库系统/课件/数据库系统_课件_07-1数据库设计.pptx'
          git mv '数据库系统/课件/数据库系统_课件_07-1数据库设计_最新版.pptx' '数据库系统/课件/数据库系统_课件_07-1数据库设计.pptx'

          node <<'NODE'
          const fs = require('fs');
          const manifest = JSON.parse(fs.readFileSync('manifest.json', 'utf8'));

          const bigData = manifest.subjects.find((item) => item.name === '大数据');
          if (!bigData) throw new Error('大数据 subject not found');
          const mapReduce = bigData.assets.find((item) => item.publicPath === '大数据/题库练习/大数据_题库练习_mpre课后题.md');
          if (!mapReduce) throw new Error('MapReduce asset not found');
          mapReduce.title = '大数据_题库练习_MapReduce课后题.md';
          mapReduce.publicPath = '大数据/题库练习/大数据_题库练习_MapReduce课后题.md';

          const database = manifest.subjects.find((item) => item.name === '数据库系统');
          if (!database) throw new Error('数据库系统 subject not found');
          const oldPath = '数据库系统/课件/数据库系统_课件_07-1数据库设计.pptx';
          const latestPath = '数据库系统/课件/数据库系统_课件_07-1数据库设计_最新版.pptx';
          const oldIndex = database.assets.findIndex((item) => item.publicPath === oldPath);
          const latestIndex = database.assets.findIndex((item) => item.publicPath === latestPath);
          if (oldIndex < 0 || latestIndex < 0) throw new Error('database 07-1 duplicate pair not found');

          const latest = database.assets[latestIndex];
          latest.title = '数据库系统_课件_07-1数据库设计.pptx';
          latest.publicPath = oldPath;
          database.assets = database.assets.filter((_, index) => index !== oldIndex);

          manifest.generatedAt = new Date().toISOString();
          fs.writeFileSync('manifest.json', JSON.stringify(manifest, null, 2) + '\n');
          NODE

          node scripts/update-readme.mjs
      - run: node scripts/refresh-manifest-metadata.mjs --check
      - run: node scripts/validate-materials.mjs
      - run: python3 skills/henu-public-materials/scripts/check_public_materials.py .
      - run: python3 scripts/audit-material-duplicates.py .
      - run: node scripts/update-readme.mjs --check
      - name: Commit and push
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(materials): clean duplicate and malformed names'
          git push origin HEAD:chore/migrate-material-types
